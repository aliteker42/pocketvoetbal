name: Voetbal APK

# Bouwt de debug-APK van OpenPocketCine + voetbal-modus op een GitHub-runner (Swift-Android-core,
# OpenCine sibling, Android SDK) en zet hem als download-artefact bij de run. Handmatig starten
# via "Run workflow", of automatisch bij elke push naar main / voetbal.

on:
  push:
    branches: [main, voetbal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-24.04 # Swift 6.3.3 toolchain is gebouwd voor 24.04 (libxml2.so.2); Ubuntu 26 heeft die niet meer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh
      - name: Unit tests (voetbal-logica)
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew :app:testDebugUnitTest --tests 'com.opencapture.openpocketcine.football.*'
      - name: Build debug APK
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenPocketCine-voetbal-debug-apk
          path: Apps/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
