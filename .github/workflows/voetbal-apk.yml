name: Voetbal APK

# Bouwt de debug-APK van OpenPocketCine + voetbal-modus op een GitHub-runner (Swift-Android-core,
# OpenCine sibling, Android SDK) en zet hem als download-artefact bij de run. Handmatig starten
# via "Run workflow", of automatisch bij elke push naar main / voetbal.

on:
  push:
    branches: [main, voetbal]
  workflow_dispatch:

permissions:
  contents: write # voor de 'latest'-release met de APK

jobs:
  apk:
    name: Debug APK
    # Twee runner-pools tegelijk: de 24.04-pool is 's avonds soms lang bezet. Op Ubuntu 26 mist de
    # voorgeïnstalleerde Swift-toolchain (gebouwd voor 24.04) libxml2.so.2; een symlink naar de
    # nieuwe libxml2 vangt dat op. Wie het eerst klaar is publiceert de release; de ander
    # overschrijft met dezelfde code.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check out pinned OpenCine next to the repository
        run: scripts/checkout-opencine.sh
      - name: Set up Android NDK 27
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: libxml2.so.2 voor de Swift-toolchain (Ubuntu 26)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libxml2.so.2 '; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libxml2 >/dev/null
            real="$(ls /usr/lib/x86_64-linux-gnu/libxml2.so.* | grep -v '\.so\.2$' | head -1)"
            echo "symlink libxml2.so.2 -> $real"
            sudo ln -sf "$real" /usr/lib/x86_64-linux-gnu/libxml2.so.2
            sudo ldconfig
          fi
          swift --version
      - name: Install Swift Android SDK
        run: ./scripts/ci-install-swift-android.sh
      - name: Unit tests (voetbal-logica)
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew :app:testDebugUnitTest --tests 'com.opencapture.openpocketcine.football.*'
      - name: Build debug APK
        working-directory: Apps/Android
        env:
          SWIFT_ANDROID_SDK_ID: swift-6.3.3-RELEASE_android
        run: ./gradlew :app:assembleDebug
      - name: Publiceer als release "latest" (vaste downloadlink)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp Apps/Android/app/build/outputs/apk/debug/app-debug.apk PocketVoetbal.apk
          gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest PocketVoetbal.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PocketVoetbal — nieuwste build" \
            --notes "Automatisch gebouwd uit commit ${GITHUB_SHA::7}. Download: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/PocketVoetbal.apk"
      - name: Upload APK
        continue-on-error: true # de artefact-opslag hapert soms; de release hieronder is de echte uitgang
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenPocketCine-voetbal-debug-apk-${{ matrix.runner }}
          path: Apps/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
