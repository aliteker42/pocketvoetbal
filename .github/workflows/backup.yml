name: Backup

# Een push naar een branch backup/<naam> legt die versie vast: de APK die op dat moment als
# 'latest' is gepubliceerd wordt gekopieerd naar een eigen release <naam>, die nieuwe builds
# niet overschrijven. De branch zelf bewaart de broncode.

on:
  push:
    branches: ['backup/**']

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kopieer de huidige APK naar een vaste release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME#backup/}"
          gh release download latest -R "$GITHUB_REPOSITORY" -p PocketVoetbal.apk
          mv PocketVoetbal.apk "PocketVoetbal-$name.apk"
          sha256sum "PocketVoetbal-$name.apk"
          if gh release view "$name" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$name" "PocketVoetbal-$name.apk" -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$name" "PocketVoetbal-$name.apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "PocketVoetbal $name — vaste backup" \
              --notes "Vaste backup ($(date -u +%Y-%m-%d)). Wordt niet door nieuwe builds overschreven. Broncode: branch $GITHUB_REF_NAME."
          fi
